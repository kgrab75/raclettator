#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['main']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          echo 'NEXT_PUBLIC_BRAND="Raclettator"' > .env
          pnpm run test:e2e
        env:
          DATABASE_URL: 'postgres://dummy:dummy@localhost:5432/dummy'

      - name: Playwright Summary
        uses: daun/playwright-report-summary@v4
        if: always()
        with:
          report-file: results.json
          job-summary: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

  build-and-push-image:
    runs-on: ubuntu-24.04
    needs: test
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          secrets: |
            DOTENV_PRIVATE_KEY_PRODUCTION=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          provenance: false

      - name: Build and push Prisma migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate-main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:migrate-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-and-run-image:
    runs-on: ubuntu-24.04
    needs: build-and-push-image

    steps:
      - name: Deploy Raclettator over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /srv/docker/media-stack

            echo "SSH UID: $(id -u)"
            echo "SSH GID: $(id -g)"

            ls -ld .
            ls -l .env

            test -w . && echo "Directory writable: YES" || echo "Directory writable: NO"
            test -w .env && echo "ENV writable: YES" || echo "ENV writable: NO"

            # Check whether a temporary file can actually be created
            TEMP_FILE="$(mktemp ./.ci-permission-test.XXXXXX)"
            rm "$TEMP_FILE"
            echo "Temporary file creation: OK"

            # Use the exact commit that triggered the workflow
            VERSION="${{ github.sha }}"
            export RACLETTATOR_RELEASE="$VERSION"

            # Download matching application and migration images
            docker compose pull raclettator raclettator-migrate

            # Apply database migrations
            docker compose run --rm --no-deps raclettator-migrate

            # Deploy the application
            docker compose up -d --no-deps --force-recreate raclettator

            # Persist the deployed version for subsequent Compose commands
            if grep -q '^RACLETTATOR_RELEASE=' .env; then
              sed -i "s/^RACLETTATOR_RELEASE=.*/RACLETTATOR_RELEASE=$VERSION/" .env
            else
              printf '\nRACLETTATOR_RELEASE=%s\n' "$VERSION" >> .env
            fi

            echo "Raclettator deployed from commit $VERSION"

  send-notification:
    runs-on: ubuntu-24.04
    needs: deploy-and-run-image
    steps:
      - name: Notification to PushBullet
        uses: ShaunLWM/action-pushbullet@master
        env:
          PB_TOKEN: ${{ secrets.PB_TOKEN }}
          PB_TITLE: Raclettator
          PB_TEXT: Raclettator is released.
